# Genera la serpiente de contribuciones del pie del README una vez al día
# y la publica en la rama "output" para no llenar main de commits automáticos.
name: Serpiente de contribuciones

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  generar-serpiente:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Paleta naranja: el primer color es "sin contribuciones" y el último el de más actividad.
          outputs: |
            dist/serpiente-clara.svg?color_snake=#c2410c&color_dots=#ebedf0,#ffd8b8,#ffb27a,#ff9140,#ff7a1a
            dist/serpiente-oscura.svg?color_snake=#ff7a1a&color_dots=#161b22,#4a2511,#8a3f0f,#c65a10,#ff7a1a

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
